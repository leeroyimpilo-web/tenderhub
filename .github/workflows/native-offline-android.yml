name: TenderBase Native Offline Android
on:
  push:
    branches: [development/native-offline-v1, development/native-six-screen-ui]
    paths:
      - native-android/**
      - scripts/export-native-snapshot.mjs
      - scripts/instantiate-manrope.py
      - .github/workflows/native-offline-android.yml
  workflow_dispatch:
# Supersede obsolete APK jobs when a later sprint commit is pushed.
concurrency:
  group: tenderbase-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK is installed
        run: test -d "$ANDROID_HOME" && echo "Android SDK installed"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle verified National Treasury tender snapshot
        run: node scripts/export-native-snapshot.mjs
        env:
          TENDERBASE_API_URL: https://tenderhub-v2.onrender.com
      - name: Verify real offline records exist
        run: |
          test -s native-android/app/src/main/assets/bootstrap.tenderpack
          node -e "const m=require('./native-android/app/src/main/assets/snapshot-info.json');if(m.count<1000)process.exit(1);console.log('Records packaged: '+m.count)"
      - name: Bundle open-source Manrope font
        run: |
          mkdir -p native-android/app/src/main/res/font
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/Manrope%5Bwght%5D.ttf' -o native-android/app/src/main/res/font/manrope.ttf
          test "$(git hash-object native-android/app/src/main/res/font/manrope.ttf)" = '75274da58537d6123b14f2cd0c355ad4681fc2b3'
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/OFL.txt' -o native-android/app/src/main/assets/MANROPE-OFL.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate verified static Manrope font weights
        run: |
          python -m pip install --disable-pip-version-check 'fonttools==4.58.5'
          python scripts/instantiate-manrope.py native-android/app/src/main/res/font/manrope.ttf
          test -s native-android/app/src/main/res/font/manrope_extrabold.ttf
      - name: Run native unit tests
        working-directory: native-android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile native offline Android APK
        working-directory: native-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Android lint
        working-directory: native-android
        run: gradle :app:lintDebug --no-daemon
      - name: Check real bootstrap data inside APK
        run: |
          test -s native-android/app/build/outputs/apk/debug/app-debug.apk
          unzip -Z -1 native-android/app/build/outputs/apk/debug/app-debug.apk > /tmp/tenderbase-apk-entries.txt
          grep -F 'bootstrap' /tmp/tenderbase-apk-entries.txt || true
          grep -Fx 'assets/bootstrap.tenderpack' /tmp/tenderbase-apk-entries.txt
      - name: Upload native offline APK
        uses: actions/upload-artifact@v4
        with:
          name: TenderBase-Native-Redesign-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  screenshots:
    name: Capture native Android emulator screens
    needs: native
    if: github.ref == 'refs/heads/development/native-six-screen-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TenderBase-Native-Redesign-debug
          path: native-apk
      - name: Verify APK for emulator
        run: test -s native-apk/app-debug.apk
      - name: Capture actual offline native screens on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 1536 -cores 2
          script: TENDERBASE_APK=native-apk/app-debug.apk python3 scripts/capture-native-screens.py
      - name: Upload actual native app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TenderBase-Six-Native-Screens
          path: native-screenshots/*.png
          if-no-files-found: warn
