name: eTenders source smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify official OCDS API reachability and release structure
        run: node scripts/source-smoke.mjs
