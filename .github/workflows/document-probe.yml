name: Official document URL verification
on:
  push:
    paths:
      - .github/workflows/document-probe.yml
  workflow_dispatch:
jobs:
  verify-document:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check official first-party document download
        run: node scripts/document-probe.mjs
