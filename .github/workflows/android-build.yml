name: Build TenderBase Android APK
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Verified HTTPS URL of the deployed TenderBase web app'
        required: true
        type: string
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      TENDERBASE_APP_URL: ${{ inputs.app_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify live database, official records and HTTPS
        run: |
          node -e "const u=new URL(process.env.TENDERBASE_APP_URL);if(u.protocol!=='https:')throw Error('HTTPS required');fetch(new URL('/api/health',u),{signal:AbortSignal.timeout(30000)}).then(async r=>{if(!r.ok)throw Error('Health HTTP '+r.status);const d=await r.json();if(!d.ok||!(d.count>0)||!d.lastSync)throw Error('TenderBase is not ready with imported official tenders');console.log('Verified '+d.count+' official records');}).catch(e=>{console.error(e);process.exit(1)});"
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Generate native Android platform and sync
        run: |
          npx cap add android
          npx cap sync android
      - name: Assemble signed-for-testing debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TenderBase-v2-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
