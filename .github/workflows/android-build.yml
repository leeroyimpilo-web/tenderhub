name: Build TenderBase Android APK
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/android-build.yml
      - capacitor.config.ts
      - capacitor-www/**
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Verified HTTPS URL of the deployed TenderBase web app'
        required: false
        default: 'https://tenderhub-v2.onrender.com'
        type: string
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      TENDERBASE_APP_URL: ${{ inputs.app_url || 'https://tenderhub-v2.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check preinstalled Android SDK
        run: test -d "$ANDROID_HOME" && echo "Android SDK available at $ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify live database, official records and tender search
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const root = new URL(process.env.TENDERBASE_APP_URL);
          if (root.protocol !== 'https:') throw Error('HTTPS required for Android app');
          if (!['tenderhub-v2.onrender.com'].includes(root.hostname)) {
            console.log('Using a custom HTTPS TenderBase host:', root.hostname);
          }
          async function getJson(path) {
            for (let attempt = 1; attempt <= 4; attempt++) {
              try {
                const res = await fetch(new URL(path, root), {
                  signal: AbortSignal.timeout(45000),
                  headers: { Accept: 'application/json' }
                });
                if (!res.ok) throw Error(path + ' returned HTTP ' + res.status);
                return await res.json();
              } catch (error) {
                if (attempt === 4) throw error;
                console.warn(path + ' attempt ' + attempt + ' failed, retrying:', String(error));
                await new Promise(resolve => setTimeout(resolve, attempt * 5000));
              }
            }
          }
          const health = await getJson('/api/health');
          if (!health.ok || !(health.count > 0) || !health.lastSync) {
            throw Error('Live database health is not ready: valid official records and last sync required');
          }
          const tenders = await getJson('/api/tenders?status=open&pageSize=2');
          if (!Array.isArray(tenders.items) || !(tenders.total > 0) ||
              !tenders.items[0]?.id || !tenders.items[0]?.title) {
            throw Error('Live open-tender search failed. Refusing to package empty/demo app.');
          }
          console.log('Verified live National Treasury eTenders database:', health.count, 'records');
          console.log('Verified live open-tender search:', tenders.total, 'matching records');
          NODE
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Generate native Android platform and sync
        run: |
          npx cap add android
          npx cap sync android
      - name: Assemble debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TenderBase-v2-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
