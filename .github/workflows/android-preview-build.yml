name: Build TenderBase UI preview APK
on:
  push:
    branches:
      - ui/reference-redesign-poppins
    paths:
      - .github/workflows/android-preview-build.yml
      - capacitor.config.ts
      - src/**
      - package.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TENDERBASE_APP_URL: https://tenderbase-ui-preview.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Android SDK
        run: test -d "$ANDROID_HOME" && echo "Android SDK available at $ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify live official tender data
        run: |
          node --input-type=module <<'NODE'
          const root = new URL(process.env.TENDERBASE_APP_URL);
          async function getJson(path) {
            const res = await fetch(new URL(path, root), {
              signal: AbortSignal.timeout(45000),
              headers: { Accept: 'application/json' }
            });
            if (!res.ok) throw Error(path + ' returned HTTP ' + res.status);
            return res.json();
          }
          const health = await getJson('/api/health');
          if (!health.ok || !(health.count > 0) || !health.lastSync) {
            throw Error('Live database health is not ready: official records and last sync required');
          }
          const tenders = await getJson('/api/tenders?status=open&pageSize=2');
          if (!Array.isArray(tenders.items) || !(tenders.total > 0) ||
              !tenders.items[0]?.id || !tenders.items[0]?.title) {
            throw Error('Live open-tender search failed; refusing to package an empty app.');
          }
          console.log('Verified official records:', health.count);
          console.log('Verified searchable open tenders:', tenders.total);
          NODE
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Generate Android project and sync
        run: |
          npx cap add android
          npx cap sync android
      - name: Assemble debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TenderBase-UI-Redesign-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
