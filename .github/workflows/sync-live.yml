name: Sync official National Treasury opportunities
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.TENDERHUB_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Explain missing database secret
        if: env.DATABASE_URL == ''
        run: echo 'Set TENDERHUB_DATABASE_URL in GitHub Actions secrets to enable automatic import.'
      - name: Install dependencies
        if: env.DATABASE_URL != ''
        run: npm install --no-audit --no-fund
      - name: Refresh official eTenders opportunities
        if: env.DATABASE_URL != ''
        run: npm run sync:portal
